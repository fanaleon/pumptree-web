/* Solo para esta página de prueba. En tu sitio, usá el fondo que ya tenés. */
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050D0A;
}

/* ============ DIORAMA 3D · CSS (copiar) ============ */
.pt-diorama {
  position: relative;
  width: 100%;
  max-width: 756px;
  margin: 0 auto;
  overflow: hidden;
}
.pt-stage {
  width: 756px;
  height: 600px;
  transform-origin: 0 0;
}
.pt-diorama.pt-paused * {
  animation-play-state: paused !important;
}
@media (prefers-reduced-motion: reduce) {
  .pt-diorama * {
    animation: none !important;
  }
}
@keyframes pt-turn {
  from { transform: rotateX(58deg) rotateZ(45deg); }
  to { transform: rotateX(58deg) rotateZ(405deg); }
}
@keyframes pt-unturn {
  from { transform: rotateZ(-45deg) rotateX(-58deg); }
  to { transform: rotateZ(-405deg) rotateX(-58deg); }
}
@keyframes pt-rock {
  from { transform: rotateY(-11deg); }
  to { transform: rotateY(11deg); }
}
@keyframes pt-orbit {
  from { transform: rotateZ(0deg); }
  to { transform: rotateZ(360deg); }
}
@keyframes pt-scanz {
  0% { transform: translateZ(48px); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { transform: translateZ(150px); opacity: 0; }
}
@keyframes pt-drip {
  from { background-position: 0px 0px; }
  to { background-position: 16px 0px; }
}
@keyframes pt-flick {
  0% { opacity: 0.95; }
  50% { opacity: 0.55; }
  100% { opacity: 0.95; }
}
@keyframes pt-pulse {
  0% { opacity: 0.15; }
  50% { opacity: 1; }
  100% { opacity: 0.15; }
}
/* ============ /DIORAMA 3D · CSS ============ */
</style>
</head>

<script>
/* Ajusta el diorama al ancho disponible y lo pausa cuando no se ve en pantalla. */
(function () {
  var box = document.querySelector('.pt-diorama');
  var stage = box.querySelector('.pt-stage');
  function fit() {
    var s = Math.min(1, box.parentElement.clientWidth / 756);
    stage.style.transform = 'scale(' + s + ')';
    box.style.height = (600 * s) + 'px';
  }
  fit();
  if ('ResizeObserver' in window) {
    new ResizeObserver(fit).observe(box.parentElement);
  } else {
    window.addEventListener('resize', fit);
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      box.classList.toggle('pt-paused', !entries[0].isIntersecting);
    }).observe(box);
  }
})();
</script>
