<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReNaRe animated demo</title>
<meta name="description" content="A 50-second automatic walkthrough of ReNaRe: a carbon-credit registry on Solana where no single signature is enough. Simulated screens, devnet prototype.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Literata:opsz,wght@18..144,400;18..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== ReNaRe animated demo. Everything is namespaced with .rn- so it can sit inside another page. ===== */
html,body{margin:0;background:#151210}
.rn{
  --oil:#151210; --oil-2:#1e1a16; --bone:#ece3d2; --bone-dim:#c9bda6; --flare:#c6ff2e; --sage:#6f8f6a; --orange:#e8703a;
  --line:rgba(236,227,210,.14);
  --noche:#0A141C; --noche-2:#0D1A25; --tinta:#0F1C27; --tinta-2:#142533; --lin:#1F3342; --lin-f:#2C4659;
  --hueso:#E8EEEA; --hueso-2:#A9BAB8; --niebla:#7F9594; --pino:#3B8C63; --amber:#d9a441;
  position:relative; box-sizing:border-box; width:100%; max-width:1080px; margin:0 auto; padding:14px;
  background:var(--oil); color:var(--bone); font-family:'Literata',Georgia,serif;
  border:1px solid var(--line); border-radius:4px;
  background-image:linear-gradient(rgba(198,255,46,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(198,255,46,.045) 1px,transparent 1px);
  background-size:40px 40px;
}
.rn *{box-sizing:border-box}
.rn-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 12px;flex-wrap:wrap}
.rn-title{font-family:'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em;font-size:15px}
.rn-title small{font-family:'JetBrains Mono',monospace;text-transform:none;letter-spacing:.02em;font-size:11px;color:var(--bone-dim);margin-left:10px;font-weight:400}
.rn-ctl{display:flex;gap:8px;align-items:center}
.rn-btn{font:500 11.5px 'JetBrains Mono',monospace;color:var(--bone);background:transparent;border:1px solid var(--line);border-radius:2px;padding:7px 11px;cursor:pointer;letter-spacing:.04em}
.rn-btn:hover{border-color:var(--flare);color:var(--flare)}
.rn-btn:focus-visible,.rn-dot:focus-visible,.rn a:focus-visible{outline:2px solid var(--flare);outline-offset:2px}
.rn-btn[aria-pressed="true"]{border-color:var(--flare);color:var(--flare)}
.rn-stagebox{position:relative;width:100%;overflow:hidden}
.rn-stage{position:absolute;left:0;top:0;transform-origin:0 0}

/* ---- the app window ---- */
.rn-app{position:absolute;background:var(--noche);border:1px solid var(--lin-f);border-radius:8px;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--hueso)}
.rn-chrome{height:30px;display:flex;align-items:center;gap:7px;padding:0 12px;background:#0c1822;border-bottom:1px solid var(--lin)}
.rn-chrome i{width:9px;height:9px;border-radius:50%;background:#26394a;display:block}
.rn-url{margin-left:10px;flex:1;max-width:340px;height:18px;border-radius:9px;background:#08111a;color:var(--niebla);font:11px 'JetBrains Mono',monospace;display:flex;align-items:center;padding:0 10px;overflow:hidden;white-space:nowrap}
.rn-screen{position:absolute;left:0;right:0;top:30px;bottom:0;overflow:hidden}
.rn-scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .35s ease}
.rn-scene.on{opacity:1;visibility:visible}
.rn-reduce .rn-scene{transition:none}

/* intro */
.s-intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse 70% 60% at 50% 40%,#10283a 0%,var(--noche) 70%)}
.s-intro img{width:74px;height:auto;opacity:0}
.s-intro .wm{font:700 46px/1 system-ui,sans-serif;letter-spacing:.34em;margin:16px 0 0 .34em;opacity:0}
.s-intro .rule{width:0;height:1px;background:var(--pino);margin:16px 0}
.s-intro .c{font-size:13px;letter-spacing:.3em;color:var(--hueso-2);opacity:0}
.s-intro .reg{font-size:12.5px;color:var(--niebla);margin-top:6px;opacity:0}
.s-intro .pw{margin-top:22px;font:11px 'JetBrains Mono',monospace;color:var(--niebla);opacity:0}
.s-intro .pw b{color:var(--hueso);font-weight:500}
.on .s-intro-a{animation:rnfade .8s ease forwards}
.rn-scene.on img{animation:rnfade .9s ease .1s forwards}
.rn-scene.on .wm{animation:rnfade .9s ease .5s forwards}
.rn-scene.on .rule{animation:rnrule 1s ease .9s forwards}
.rn-scene.on .c{animation:rnfade .8s ease 1.3s forwards}
.rn-scene.on .reg{animation:rnfade .8s ease 1.6s forwards}
.rn-scene.on .pw{animation:rnfade .8s ease 2.1s forwards}
@keyframes rnfade{to{opacity:1}}
@keyframes rnrule{to{width:150px}}

/* the notice is on every screen of the real app */
.lbl{display:inline-block;font:600 10.5px/1.35 system-ui,sans-serif;color:var(--hueso);padding:2px 8px;border-left:3px solid var(--amber);background:rgba(217,164,65,.1);border-radius:3px}

/* login */
.s-login{display:flex;align-items:center;justify-content:center;background:var(--noche)}
.card{width:330px;padding:26px 26px 22px;background:var(--tinta);border:1px solid var(--lin);border-radius:8px}
.card h3{margin:0 0 4px;font:600 21px system-ui}
.card .sub{margin:0 0 10px;font-size:12px;color:var(--hueso-2)}
.fld{margin-top:12px}
.fld label{display:block;font-size:11px;color:var(--hueso-2);margin-bottom:5px}
.inp{height:34px;border:1px solid var(--lin-f);border-radius:6px;background:var(--noche-2);padding:0 10px;display:flex;align-items:center;font-size:13px;color:var(--hueso);white-space:nowrap;overflow:hidden}
.inp.focus{border-color:var(--pino);box-shadow:0 0 0 3px rgba(59,140,99,.18)}
.inp.ph{color:var(--niebla)}
.caret::after{content:'';display:inline-block;width:1px;height:14px;background:var(--hueso);margin-left:1px;animation:rnblink 1s steps(1) infinite}
@keyframes rnblink{50%{opacity:0}}
.pbtn{margin-top:18px;height:36px;border-radius:6px;background:var(--pino);color:#fff;display:flex;align-items:center;justify-content:center;font:600 13px system-ui;transition:transform .12s,filter .2s}
.pbtn.pr{transform:scale(.97);filter:brightness(1.15)}
.pbtn.done{background:#2b6b4c}
.gbtn{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--lin-f);color:var(--hueso);display:inline-flex;align-items:center;font:600 12px system-ui;background:transparent;transition:transform .12s,background .2s,border-color .2s}
.gbtn.go{background:var(--pino);border-color:var(--pino);color:#fff}
.gbtn.pr{transform:scale(.95)}
.gbtn.off{opacity:.45}
.demo{margin-top:16px;padding-top:12px;border-top:1px solid var(--lin);font-size:11px;color:var(--hueso-2);line-height:1.4}
.demo b{display:block;color:var(--hueso);font-weight:600;margin-bottom:3px}

/* panel */
.p-head{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(10,20,28,.9);border-bottom:1px solid var(--lin)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:26px;height:auto}
.brand b{display:block;font:700 13px system-ui;letter-spacing:.2em;margin-bottom:3px}
.who{display:flex;align-items:center;gap:10px;font-size:12px;transition:opacity .25s}
.who b{display:block;font-weight:600}
.who small{display:block;color:var(--niebla);font-size:10.5px}
.av{width:30px;height:30px;border-radius:50%;background:var(--tinta-2);border:1px solid var(--lin-f);display:grid;place-items:center;font:600 11px system-ui;transition:background .3s}
.p-tabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--lin);height:42px}
.tab{padding:0 12px;font-size:12px;color:var(--niebla);display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent;height:32px;white-space:nowrap}
.tab.act{color:var(--hueso);border-color:var(--pino)}
.tab em{font-style:normal;font-size:10px;background:var(--tinta-2);border-radius:9px;padding:1px 6px;color:var(--hueso-2)}
.p-body{position:absolute;left:0;right:0;top:98px;bottom:0;padding:16px 18px;overflow:hidden}
.p-body h4{margin:0 0 3px;font:600 15px system-ui}
.p-body .hint{margin:0 0 12px;font-size:11.5px;color:var(--hueso-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.pv{margin-top:12px;padding:9px 12px;border:1px dashed var(--lin-f);border-radius:6px;font:11px 'JetBrains Mono',monospace;color:var(--hueso-2);opacity:0;transition:opacity .4s}
.pv.on{opacity:1}
.pv b{color:var(--hueso);font-weight:500}
.toast{position:absolute;right:14px;top:64px;max-width:260px;padding:9px 12px;background:#12261f;border:1px solid var(--pino);border-radius:6px;font-size:11.5px;line-height:1.4;opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s;z-index:6}
.toast.on{opacity:1;transform:none}
.toast .h{font:11px 'JetBrains Mono',monospace;color:#8fe0b5}
.row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--lin);background:var(--tinta);border-radius:8px}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-size:13px;margin-bottom:2px}
.row .n small{color:var(--hueso-2);font-size:11px}
.sig{display:flex;gap:5px;align-items:center;font:11px 'JetBrains Mono',monospace;color:var(--hueso-2)}
.sig i{width:11px;height:11px;border-radius:50%;border:1px solid var(--lin-f);display:block;transition:background .4s,border-color .4s}
.sig i.ok{background:var(--pino);border-color:var(--pino)}
.pill{font-size:10.5px;padding:3px 9px;border-radius:10px;background:var(--tinta-2);color:var(--hueso-2);white-space:nowrap;transition:background .3s,color .3s}
.pill.g{background:#12261f;color:#8fe0b5}
.pill.a{background:rgba(217,164,65,.14);color:var(--amber)}

/* escalation */
.esc{display:flex;align-items:center;justify-content:center;gap:0;margin-top:14px}
.ms{width:200px;padding:14px;border:1px solid var(--lin-f);border-radius:8px;background:var(--tinta);text-align:center;transition:border-color .5s,box-shadow .5s}
.ms b{display:block;font-size:13px;margin-bottom:4px}
.ms small{font-size:11px;color:var(--hueso-2)}
.ms.lit{border-color:var(--pino);box-shadow:0 0 0 3px rgba(59,140,99,.15)}
.arrow{position:relative;width:110px;height:2px;background:var(--lin-f);margin:0 8px}
.arrow::after{content:'';position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:8px solid var(--lin-f);border-right:0}
.arrow i{position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--flare);box-shadow:0 0 8px var(--flare);opacity:0}
.arrow.run i{animation:rnrun 1.2s ease-in-out forwards}
@keyframes rnrun{0%{left:0;opacity:1}100%{left:calc(100% - 8px);opacity:1}}
.mint{margin:16px auto 0;width:420px;padding:12px 14px;border:1px solid var(--lin);border-radius:8px;background:var(--tinta);font:11.5px/1.6 'JetBrains Mono',monospace;color:var(--hueso-2);opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.mint.on{opacity:1;transform:none}
.mint b{color:var(--hueso);font-weight:500}
.mint .k{color:var(--niebla)}

/* issued */
.big{display:flex;align-items:center;gap:22px;margin-top:6px}
.num{font:700 58px/1 system-ui;letter-spacing:-.02em;min-width:150px}
.num small{display:block;font:400 12px system-ui;letter-spacing:0;color:var(--hueso-2);margin-top:6px}
.badges{display:flex;flex-direction:column;gap:7px}
.bdg{font:11px 'JetBrains Mono',monospace;padding:6px 10px;border:1px solid var(--lin-f);border-radius:6px;color:var(--hueso-2);opacity:0;transform:translateX(-6px);transition:opacity .5s,transform .5s}
.bdg.on{opacity:1;transform:none}
.bdg b{color:#8fe0b5;font-weight:500}
.stp{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.stp span{font-size:11px;padding:6px 10px;border-radius:6px;border:1px solid var(--lin);color:var(--niebla);transition:all .4s}
.stp span.on{border-color:var(--pino);color:#8fe0b5;background:#12261f}
table.tb{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.tb th{font-weight:500;color:var(--niebla);text-align:left;padding:6px 8px;border-bottom:1px solid var(--lin);font-size:11px}
.tb td{padding:10px 8px;border-bottom:1px solid var(--lin)}
.tb td.r{text-align:right}
.tb small{display:block;color:var(--niebla);font:10.5px 'JetBrains Mono',monospace;margin-top:2px}
.modal{position:absolute;inset:0;background:rgba(5,10,15,.62);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s;z-index:5}
.modal.on{opacity:1;visibility:visible}
.dlg{width:380px;padding:18px;background:var(--tinta);border:1px solid var(--lin-f);border-radius:10px}
.dlg h5{margin:0 0 4px;font:600 15px system-ui}
.dlg p{margin:0 0 6px;font-size:11px;line-height:1.45;color:var(--hueso-2)}
.dlg .inp{height:30px;font-size:12px}
.dlg .fld{margin-top:9px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

/* explorer card */
.ex{margin:0 auto;max-width:520px;border:1px solid var(--lin-f);border-radius:8px;background:#0b1620;overflow:hidden}
.ex .bar{padding:9px 14px;background:#101f2b;border-bottom:1px solid var(--lin);font:11px 'JetBrains Mono',monospace;color:var(--niebla);display:flex;justify-content:space-between}
.ex dl{margin:0;padding:6px 14px 10px;display:grid;grid-template-columns:150px 1fr;font-size:12px}
.ex dt{color:var(--niebla);padding:6px 0;border-bottom:1px solid #12222f}
.ex dd{margin:0;padding:6px 0;border-bottom:1px solid #12222f;font-family:'JetBrains Mono',monospace;font-size:11.5px;word-break:break-all}
.ex dd.g{color:#8fe0b5}
.ex .memo{margin:2px 14px 14px;padding:9px 11px;border-radius:6px;background:#0a121a;border:1px solid var(--lin);font:10.5px/1.5 'JetBrains Mono',monospace;color:var(--hueso-2);word-break:break-all}
.ex .memo b{color:var(--flare);font-weight:500}
.fin{position:absolute;inset:0;background:rgba(10,20,28,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;opacity:0;visibility:hidden;transition:opacity .5s;z-index:8;padding:20px}
.fin.on{opacity:1;visibility:visible}
.fin h3{margin:0;font:700 22px system-ui;max-width:460px;line-height:1.25}
.fin p{margin:0;font-size:12px;color:var(--hueso-2);max-width:440px;line-height:1.5}
.fin .go{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.fin a{font:600 12px system-ui;text-decoration:none;color:var(--hueso);border:1px solid var(--lin-f);padding:9px 14px;border-radius:6px}
.fin a.p{background:var(--flare);border-color:var(--flare);color:#151210}
.fin a:hover{filter:brightness(1.12)}

/* cursor */
.cur{position:absolute;left:0;top:0;width:22px;height:22px;z-index:20;pointer-events:none;transition:transform .65s cubic-bezier(.45,.05,.2,1),opacity .3s;opacity:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.cur.on{opacity:1}
.cur svg{display:block}
.cur::after{content:'';position:absolute;left:-9px;top:-9px;width:22px;height:22px;border-radius:50%;border:2px solid var(--flare);opacity:0;transform:scale(.3)}
.cur.click::after{animation:rnping .5s ease-out}
@keyframes rnping{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.6)}}

/* ledger */
.rn.nar .ms{width:168px;padding:12px 8px}.rn.nar .arrow{width:60px}.rn.nar .mint{width:440px}.rn.nar .p-tabs{padding:10px 8px 0;gap:0}.rn.nar .tab{padding:0 9px}.rn.nar .row{gap:9px;padding:12px 10px}.rn.nar .num{font-size:50px;min-width:130px}.rn.nar .big{gap:14px}.rn.nar .ex dl{grid-template-columns:110px 1fr}
.rn-ledger{position:absolute;background:var(--oil-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.rn-ledger h5{margin:0;padding:13px 16px 11px;font:700 11px 'JetBrains Mono',monospace;letter-spacing:.16em;color:var(--sage);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
.rn-ledger h5 span{color:var(--flare);font-weight:500;letter-spacing:.04em;text-transform:none;font-size:10.5px}
.rn-ledger ol{list-style:none;margin:0;padding:6px 0;flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.rn-ledger li{display:flex;gap:10px;padding:8px 16px;font:11.5px/1.45 'JetBrains Mono',monospace;color:var(--bone-dim);animation:rnin .5s ease both;border-top:1px dashed rgba(236,227,210,.08)}
.rn-ledger li:first-child{border-top:0}
.rn-ledger li .d{flex:0 0 7px;height:7px;border-radius:50%;margin-top:5px;background:var(--flare);box-shadow:0 0 6px rgba(198,255,46,.6)}
.rn-ledger li.k .d{background:var(--orange);box-shadow:0 0 6px rgba(232,112,58,.6)}
.rn-ledger li.s .d{background:var(--sage);box-shadow:none}
.rn-ledger li b{display:block;color:var(--bone);font-weight:500}
.rn-ledger li i{font-style:normal;color:var(--flare);opacity:.9}
.rn-ledger li.out{opacity:0;transition:opacity .4s}
@keyframes rnin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rn-reduce .rn-ledger li{animation:none}

/* caption */
.rn-cap{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;padding:14px 2px 2px;flex-wrap:wrap}
.rn-cap .t{flex:1;min-width:240px}
.rn-step{font:500 11px 'JetBrains Mono',monospace;color:var(--sage);letter-spacing:.12em}
.rn-ct{font:700 clamp(17px,2.4vw,22px)/1.2 'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em;margin:5px 0 6px;color:var(--bone)}
.rn-cs{font-size:14px;line-height:1.55;color:var(--bone-dim);max-width:640px;margin:0}
.rn-dots{display:flex;gap:7px;align-items:center;padding-top:6px}
.rn-dot{width:26px;height:6px;border-radius:3px;background:rgba(236,227,210,.18);border:0;padding:0;cursor:pointer;position:relative;overflow:hidden}
.rn-dot.done{background:var(--sage)}
.rn-dot.now{background:var(--flare);box-shadow:0 0 8px rgba(198,255,46,.5)}
.rn-foot{margin:12px 2px 0;font:11px/1.5 'JetBrains Mono',monospace;color:var(--bone-dim);opacity:.85}
.rn-foot b{color:var(--bone);font-weight:500}
.rn-noscript{padding:20px;color:var(--bone-dim)}
</style>
</head>
<body>
<div class="rn" id="rn" aria-label="ReNaRe animated demo">
  <div class="rn-top">
    <div class="rn-title">ReNaRe <small data-i="sub">Automatic walkthrough · simulated screens</small></div>
    <div class="rn-ctl">
      <button class="rn-btn" id="rnPlay" type="button" aria-pressed="false">PAUSE</button>
      <button class="rn-btn" id="rnLang" type="button" aria-label="Language">EN | ES</button>
    </div>
  </div>
  <div class="rn-stagebox" id="rnBox" role="img" aria-label="Animated walkthrough of the ReNaRe platform">
    <div class="rn-stage" id="rnStage">
      <div class="rn-app" id="rnApp">
        <div class="rn-chrome"><i></i><i></i><i></i><span class="rn-url">renare-production.up.railway.app</span></div>
        <div class="rn-screen" id="rnScreen"></div>
        <div class="cur" id="rnCur"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 2l14 8.5-6.2 1.6L8.3 18.5z" fill="#fff" stroke="#0a141c" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
      </div>
      <aside class="rn-ledger" id="rnLedger" aria-live="off">
        <h5><b data-i="ledger">On-chain trace</b><span>devnet</span></h5>
        <ol id="rnLog"></ol>
      </aside>
    </div>
  </div>
  <div class="rn-cap">
    <div class="t" aria-live="polite">
      <div class="rn-step" id="rnStep">1 / 8</div>
      <div class="rn-ct" id="rnCt"></div>
      <p class="rn-cs" id="rnCs"></p>
    </div>
    <div class="rn-dots" id="rnDots" role="group" aria-label="Steps"></div>
  </div>
  <p class="rn-foot" data-i="foot">ReNaRe is an infrastructure proposal and a technical prototype on Solana devnet. It is not the official registry. Screens are simulated; the logic and the on-chain steps are real.</p>
  <noscript><p class="rn-noscript">ReNaRe: a carbon-credit registry on Solana where a province and the nation each need two signatures, credits are issued once and issuance is closed, and every retirement records who and why on-chain. Try the live prototype at https://renare-production.up.railway.app</p></noscript>
</div>

<script>

        led('', t('lLoad'), t('lLoad2'), H[0]); toast(H[0]); await sleep(700);
        led('', t('lOpen'), t('lOpen2'), H[1]); await sleep(1100); hideCursor();
      } },
    { html: sProv, run: async function () {
        who('uPA'); E('cP').textContent = '1'; await sleep(900);
        await press(E('bt')); E('sg').children[1].classList.add('ok'); E('sgn').textContent = '2/2'; E('pl').textContent = t('signed'); E('pl').className = 'pill g';
        led('', t('lSig2'), '', H[2]); toast(H[2]); await sleep(900);
        who('uPO'); E('bt').textContent = t('execB'); E('pl').textContent = t('pendT'); E('pl').className = 'pill a'; await sleep(500);
        await press(E('bt')); E('pl').textContent = t('done'); E('pl').className = 'pill g'; E('bt').classList.add('off');
        led('', t('lExe'), '', H[3]); await sleep(1000); hideCursor();
      } },
    { html: sEsc, run: async function () {
        who('uPO'); await sleep(700);
        E('ar').classList.add('run'); await sleep(1200); E('m2').classList.add('lit'); E('m2s').textContent = '0 / 2';
        E('mt').classList.add('on'); led('', t('lMint'), t('lMint2'), H[5]); await sleep(900);
        led('s', t('lNat'), t('lNat2'), H[4]); await sleep(1600);
      } },
    { html: sNat, run: async function () {
        who('uNO'); E('cP').textContent = '1'; await sleep(800);
        await press(E('bt')); E('sg').children[0].classList.add('ok'); E('sgn').textContent = '1/2'; E('pl').textContent = t('signed'); E('pl').className = 'pill g';
        led('', t('lN1'), '', H[6]); toast(H[6]); await sleep(900);
        who('uNA'); E('pl').textContent = t('pendT'); E('pl').className = 'pill a'; await sleep(500);
        await press(E('bt')); E('sg').children[1].classList.add('ok'); E('sgn').textContent = '2/2'; E('pl').textContent = t('signed'); E('pl').className = 'pill g';
        led('', t('lN2'), '', H[7]); await sleep(700);
        who('uNO'); E('bt').textContent = t('execB'); await sleep(450);
        await press(E('bt')); E('bt').classList.add('off'); hideCursor();
        led('', t('lIss'), t('lIss2'), H[8]); await sleep(600);
        scr.querySelector('.rn-scene.on').innerHTML = sIssued(); who('uPO'); E('cC').textContent = '1';
        var n = 0, el = E('nm'); while (n < 500) { n = Math.min(500, n + 25); el.firstChild.nodeValue = String(n); await sleep(32); }
        await sleep(300); E('g3').classList.add('on'); await sleep(350);
        E('g1').classList.add('on'); led('k', t('lClose'), t('lClose2'), H[0]); await sleep(450); E('g2').classList.add('on'); await sleep(1500);
      } },
    { html: sRet, run: async function () {
        who('uPO'); E('cC').textContent = '1'; await sleep(700);
        await press(E('rb')); E('md').classList.add('on'); await sleep(450);
        await move(E('dq')); await type(E('dq'), '100', 70);
        await move(E('db')); await type(E('db'), t('rdBv'), 32);
        await move(E('dr')); await type(E('dr'), t('rdRv'), 26);
        await press(E('ds')); E('md').classList.remove('on'); hideCursor();
        var s = E('stp'); s.innerHTML = '<span class="on">✓ ' + t('s1') + '</span><span>' + t('s2') + '</span><span>' + t('s3') + '</span>';
        led('', t('lReq'), t('lReq2'), H[1]); await sleep(900);
        who('uPA'); s.children[1].classList.add('on'); s.children[1].textContent = '✓ ' + t('s2'); led('', t('lAud'), '', H[2]); await sleep(900);
        who('uPO'); s.children[2].classList.add('on'); s.children[2].textContent = '✓ ' + t('s3');
        led('k', t('lBurn'), t('lBurn2'), H[3]); await sleep(500);
        var a = E('av2'), v = 500; while (v > 400) { v -= 5; a.textContent = String(v); await sleep(22); }
        led('s', t('lSup'), '', ''); await sleep(1700);
      } },
    { html: sVerify, run: async function () {
        await sleep(600); E('xs').textContent = '400'; await sleep(2900);
        E('fin').classList.add('on'); await sleep(3600);
      } }
  ];

  /* ---------- player ---------- */
  var cur_i = -1, auto_next = true;
  var dots = document.getElementById('rnDots');
  SCENES.forEach(function (s, i) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'rn-dot'; b.setAttribute('aria-label', 'Step ' + (i + 1));
    b.addEventListener('click', function () { go(i); });
    dots.appendChild(b);
  });
  function caption(i) {
    var c = t('c' + i);
    document.getElementById('rnStep').textContent = t('step') + ' ' + (i + 1) + ' / ' + SCENES.length;
    document.getElementById('rnCt').textContent = c[0];
    document.getElementById('rnCs').textContent = c[1];
    [].forEach.call(dots.children, function (d, k) { d.className = 'rn-dot' + (k < i ? ' done' : (k === i ? ' now' : '')); });
  }
  function applyStatic() {
    root.querySelector('[data-i="sub"]').textContent = t('sub');
    root.querySelector('[data-i="ledger"]').textContent = t('ledger');
    root.querySelector('[data-i="foot"]').textContent = t('foot');
    document.getElementById('rnPlay').textContent = paused ? t('resume') : t('play');
    document.documentElement.lang = lang;
    document.getElementById('rnLang').textContent = lang === 'en' ? 'EN | es' : 'en | ES';
  }
  async function go(i, keepLog) {
    runId++; var my = runId; cur_i = i;
    if (i === 0 || !keepLog) ledClear();
    hideCursor(); cur.style.transform = 'translate(560px,420px)';
    scr.innerHTML = '<div class="rn-scene">' + SCENES[i].html() + '</div>';
    var sc = scr.firstChild; void sc.offsetWidth; sc.classList.add('on');
    caption(i);
    try {
      await SCENES[i].run();
      if (my !== runId) return;
      if (i + 1 < SCENES.length) { sc.classList.remove('on'); await sleep(reduce ? 10 : 350); go(i + 1, true); }
      else { if (reduce) { paused = true; applyStatic(); return; } sc.classList.remove('on'); await sleep(450); go(0); }
    } catch (e) { if (e !== CANCEL) throw e; }
  }

  document.getElementById('rnPlay').addEventListener('click', function () {
    paused = !paused; this.setAttribute('aria-pressed', String(paused)); applyStatic();
  });
  document.getElementById('rnLang').addEventListener('click', function () {
    lang = lang === 'en' ? 'es' : 'en'; applyStatic(); go(Math.max(0, cur_i));
  });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (en) { auto = !en[0].isIntersecting; }, { threshold: 0.15 }).observe(root);
  }
  document.addEventListener('visibilitychange', function () { auto = document.hidden; });

  applyStatic(); layout();
  document.getElementById('rnPlay').setAttribute('aria-pressed', String(paused));
  window.RN = { go: go, pause: function (p) { paused = p; applyStatic(); } };
  go(0);
})();
</script>
